<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; width: 320px; padding: 12px; margin: 0; }
    h3 { margin: 0 0 8px 0; font-size: 14px; color: #0a66c2; }
    .info { font-size: 12px; color: #555; margin-bottom: 8px; word-break: break-all; }
    input, textarea { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 13px; }
    textarea { height: 80px; resize: vertical; }
    button { width: 100%; padding: 8px; background: #0a66c2; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 6px; }
    button:hover { background: #004182; }
    .row { display: flex; gap: 6px; }
    .btn-sec { background: #444; }
    .btn-sec:hover { background: #222; }
    #estado { font-size: 12px; color: green; text-align: center; height: 16px; }
  </style>
</head>
<body>
  <h3 id="nombre">Cargando perfil...</h3>
  <div class="info" id="cargo"></div>
  <input type="text" id="etiqueta" placeholder="Etiqueta (ej. Máster, Universidad, Recruiter)">
  <textarea id="nota" placeholder="Escribe aquí tu anotación..."></textarea>
  <button id="guardar">Guardar nota</button>
  <div class="row">
    <button id="exportCsv" class="btn-sec">Exportar CSV</button>
    <button id="exportJson" class="btn-sec">Exportar JSON</button>
  </div>
  <div id="estado"></div>
  <script src="popup.js"></script>
</body>
</html>
